name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m telco_churn.data fetch
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest --cov=telco_churn --cov-report=term-missing -m "not locked_environment"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/reproduce_benchmark.py --fetch
      - name: Verify planner in Chromium
        env:
          TELCO_MODEL_PATH: artifacts/reproduced_quick/champion.joblib
        run: |
          python -m uvicorn telco_churn.api:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python scripts/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planner-browser-smoke
          path: reports/v4/browser_smoke/
