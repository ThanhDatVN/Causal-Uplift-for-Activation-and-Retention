name: tests

# Chạy phần test không cần dữ liệu Criteo local.
#
# Ba file bị loại vì cần
# data/criteo-research-uplift-v2.1.csv.gz (khoảng 300 MB nén, không commit):
#   tests/test_data.py       — data contract và split trên dữ liệu thật
#   tests/test_baselines.py  — fit model trên mẫu Criteo
#   tests/test_webapp.py     — cần artifact release và champion scorer
#
# Acceptance cua dashboard CO chay o day: output/product/dashboard.html la file tracked
# nen khong can du lieu goc. Acceptance cua web app thi khong — no can champion scorer
# .joblib, von bi .gitignore loai.
#
# CI xanh vì thế **không** thay thế được lần chạy đầy đủ trên máy có dữ liệu. Trước khi
# phát hành phải chạy `pytest tests -q` đầy đủ cộng cả hai acceptance test trình duyệt.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Push lien tiep len cung mot branch thi chi lan cuoi con y nghia.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-free-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show resolved versions
        run: |
          python -c "import numpy, scipy, sklearn, lightgbm, econml, pandas; [print(f'{m.__name__:14s} {m.__version__}') for m in (numpy, scipy, sklearn, lightgbm, econml, pandas)]"

      - name: Run data-free tests
        id: tests
        run: |
          set +e
          pytest tests -q -rf \
            --ignore=tests/test_data.py \
            --ignore=tests/test_baselines.py \
            --ignore=tests/test_webapp.py 2>&1 | tee pytest-output.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      # Log day du can auth moi tai duoc, con annotation thi doc duoc cong khai. Buoc nay
      # chuyen dong tom tat that bai thanh annotation de chan doan tu xa.
      - name: Surface failures as annotations
        if: steps.tests.outputs.status != '0'
        run: |
          echo "::error title=pytest::exit code ${{ steps.tests.outputs.status }}"
          sed -n '/short test summary info/,$p' pytest-output.txt | head -40 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line}"
          done
          tail -25 pytest-output.txt | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::tail| ${line}"
          done
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Dashboard la mot file HTML tu chua da commit, nen kiem duoc ma khong can du lieu
      # goc. Truoc day buoc nay chi chay o may local, tuc mot thay doi lam vo dashboard
      # co the lot qua CI.
      - name: Dashboard browser acceptance
        run: node scripts/smoke_dashboard_browser.mjs

      - name: Check internal documentation links
        run: |
          python - <<'PY'
          import pathlib, posixpath, re, sys
          sys.path.insert(0, '.')
          from tests.repo_state import ignored_paths

          # Duong dan bi .gitignore loai khoi repo thi vang mat tren CI la dung thiet ke,
          # khong phai loi tai lieu. Dung chung quy tac voi
          # tests/test_documentation_integrity.py de khong phai bao tri hai danh sach.
          docs = [p for p in pathlib.Path('.').rglob('*.md') if '.venv' not in p.parts]
          absent = {}
          for p in docs:
              text = p.read_text(encoding='utf-8', errors='replace')
              for m in re.finditer(r'\[([^\]]*)\]\(([^)]+)\)', text):
                  target = m.group(2).split('#')[0].strip()
                  if not target or target.startswith(('http', 'mailto')):
                      continue
                  if (p.parent / target).exists():
                      continue
                  resolved = posixpath.normpath((p.parent / target).as_posix())
                  absent.setdefault(resolved, []).append(f'{p.as_posix()} -> {target}')

          by_design = ignored_paths(absent)
          broken = sorted(msg for r, msgs in absent.items()
                          if r not in by_design for msg in msgs)
          skipped = sum(len(msgs) for r, msgs in absent.items() if r in by_design)
          print(f'{len(docs)} markdown files checked, '
                f'{len(broken)} broken links, {skipped} links to gitignored targets skipped')
          for item in broken:
              print('  BROKEN', item)
          sys.exit(1 if broken else 0)
          PY
