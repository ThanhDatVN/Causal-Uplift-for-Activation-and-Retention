# --- Hillstrom real-data primary (WP02/WP03) --------------------------------
# Unlike the payment-support contract above, this one describes a campaign that
# actually ran: a randomised three-arm e-mail test with a documented design and
# a two-week readout. The design probability is taken from the source's own
# description and is marked as declared, not independently verified — an
# assignment audit has not been run on it yet.

[[contract]]
contract_id = "hillstrom_mens_email"
revision = 1
population = "Customers who purchased in the twelve months before the campaign and were eligible to receive marketing e-mail."
decision_unit = "customer"
randomization_unit = "customer"
bau_action = "no_email"
endpoint = "Conversion recorded within two weeks of the send, counted from t0."
unknown_outcome_policy = "keep_unknown"
competing_events = []
estimand = "ITT: E[Y(mens_email) - Y(no_email)] over the eligible cohort as assigned at t0; positive means conversions gained."
inference_method = "Cross-fitted doubly robust scores with paired policy contrasts; studentized bootstrap intervals over the customer."
cohort_definition = "as_assigned"
is_negative_control = false
evidence_state = "PLANNED"
reward_unit = "spend_currency_units"
eligibility_rules = [
  "purchased within the twelve months before t0",
  "holds a deliverable e-mail address at t0",
]
deployment_bounds = [
  "Method study on a public dataset; not a recommendation for any operator.",
  "Two-week readout only; nothing here speaks to longer-horizon effects.",
  "The third arm (womens_email) exists in the data and is not the primary contrast.",
]
assumptions = [
  "ASSUMPTION: assignment was randomised as the source describes; this repository has not audited it.",
  "ASSUMPTION: the three arms share one eligible frame, so the control arm is a valid comparator.",
]
open_questions = [
  "Does an assignment audit on 8 covariates reject exchangeability the way it did for Orange?",
  "Is spend the right reward, or is conversion the decision-relevant endpoint?",
]

[contract.timing]
time_zero_rule = "The moment the campaign was sent; eligibility, assignment and follow-up all start there."
feature_cutoff_offset_days = 0.0
assignment_offset_days = 0.0
follow_up_start_offset_days = 0.0
delivery_window_days = 1.0
horizon_days = 14
maturity_lag_days = 0
correction_window_days = 0

[contract.capacity]
period = "campaign"
slots_per_period = 12800
cooldown_days = 0
shared_resource = "email_send_quota"

[[contract.actions]]
name = "no_email"
version = "hillstrom-2008"
unit_cost = 0.0
channel = "none"
is_bau = true
requires_delivery = false
reversible = true

[[contract.actions]]
name = "mens_email"
version = "hillstrom-2008"
unit_cost = 0.0
channel = "email"
is_bau = false
requires_delivery = true
reversible = false

[[contract.actions]]
name = "womens_email"
version = "hillstrom-2008"
unit_cost = 0.0
channel = "email"
is_bau = false
requires_delivery = true
reversible = false

[[contract.endpoints]]
target_id = "conversion14"
target_kind = "binary_event"
orientation = "beneficial"
unit = "conversion_events"
role = "outcome"
window_start_offset_days = 0.0
window_end_offset_days = 14.0
maturity_rule = "Final at t0 + 14 days; the source records no later corrections."
description = "Purchase recorded within two weeks of the send."

[[contract.endpoints]]
target_id = "visit14"
target_kind = "binary_event"
orientation = "beneficial"
unit = "visit_events"
role = "effect"
window_start_offset_days = 0.0
window_end_offset_days = 14.0
maturity_rule = "Same window as conversion14."
description = "Site visit within two weeks. An intermediate step, not the decision endpoint."

[[contract.endpoints]]
target_id = "spend14"
target_kind = "currency"
orientation = "beneficial"
unit = "spend_currency_units"
role = "reward"
window_start_offset_days = 0.0
window_end_offset_days = 14.0
maturity_rule = "Same window as conversion14; the source reports no refunds or reversals."
description = "Money spent within two weeks. Zero for the large majority of customers."
